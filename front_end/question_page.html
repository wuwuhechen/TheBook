<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>答题</title>

    <style>
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }

        #explanation {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #ccc;
            display: none;
        }
    </style>
</head>


<body>
    <h1>
        题号: {{.ID}}, 类别: {{.Category}}
    </h1>

    <p>
        题目：{{.Question}}
    </p>

    <p>
        选项：<br>
        A. {{.OptionA}} <br>
        B. {{.OptionB}} <br>
        C. {{.OptionC}} <br>
        D. {{.OptionD}} <br>
    </p>

    <p>
        答题进度: {{.ID}}/{{.TotalQuestions}}
    </p>

    <!-- 隐藏解析字段 -->
    <input 
        type="hidden" 
        id="explanation"
        value="{{.Explanation}}"
    >

    <!-- 隐藏题目ID -->
    <input 
        type="hidden" 
        id="question_id"
        value="{{.ID}}"
    >

    <form id="answerForm">

        <label for="answer">
            选择答案：
        </label>

        <select name="answer" id="answer">

            <option value="A">A</option>

            <option value="B">B</option>

            <option value="C">C</option>

            <option value="D">D</option>

        </select>


        <button type="submit">
            提交答案
        </button>

    </form>

    <!-- 显示结果 -->
    <div id="result"></div>

    <!-- 显示解析 -->
    <div id="showExplanation">
    </div>

<script>

const form = document.getElementById("answerForm");


form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const answer =
            document.getElementById("answer").value;


        const questionID =
            document.getElementById("question_id").value;



        const data = {
            question_id: Number(questionID),
            answer: answer
        };



        const response = await fetch(
            "/submit_answer",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(data)
            }
        );



        // const result = await response.json();

        const result = {
            correct: true, // 假设返回的结果是正确的
            explanation: document.getElementById("explanation").value
        }

        const resultDiv =
            document.getElementById("result");


        const explanationDiv =
            document.getElementById("showExplanation");



        if(result.correct){

            resultDiv.innerHTML =
                "✅ 回答正确";

            resultDiv.style.color =
                "green";

        }else{

            resultDiv.innerHTML =
                "❌ 回答错误";

            resultDiv.style.color =
                "red";
        }



        explanationDiv.style.display =
            "block";


        explanationDiv.innerHTML =
            "<h3>解析：</h3>" +
            result.explanation;

    }

);

</script>


</body>


</html>

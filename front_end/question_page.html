<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>答题</title>

    <style>
      #result {
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
      }

      #explanation {
        margin-top: 10px;
        padding: 10px;
        border: 1px solid #ccc;
        display: none;
      }
    </style>
  </head>

  <body>
    <h1>题号: {{.ID}}, 类别: {{.Category}}</h1>

    <p>题目：{{.Question}}</p>

    <p>
      选项：<br />
      A. {{.OptionA}} <br />
      B. {{.OptionB}} <br />
      C. {{.OptionC}} <br />
      D. {{.OptionD}} <br />
    </p>

    <p>答题进度: {{.ID}}/{{.TotalQuestions}}</p>

    <!-- 隐藏解析字段 -->
    <input type="hidden" id="explanation" value="{{.Explanation}}" />

    <!-- 隐藏题目ID -->
    <input type="hidden" id="question_id" value="{{.ID}}" />

    <form id="answerForm">
      <label for="choice"> 选择答案： </label>

      <select name="choice" id="choice">
        <option value="0">A</option>

        <option value="1">B</option>

        <option value="2">C</option>

        <option value="3">D</option>
      </select>

      <button type="submit">提交答案</button>
    </form>

    {{if .HasLastID}}
    <form id="lastQuestionForm" action="{{if .RandomSessionID}}/question/random/{{.RandomSessionID}}{{else}}/question/request{{end}}" method="{{if .RandomSessionID}}GET{{else}}POST{{end}}">
      {{if .RandomSessionID}}
      <input type="hidden" name="direction" value="last" />
      {{else}}
      <input type="hidden" name="question_id" value="{{.LastID}}" />
      {{end}}

      <button type="submit">上一题</button>
    </form>
    {{end}}

    {{if .HasNextID}}
    <form id="nextQuestionForm" action="{{if .RandomSessionID}}/question/random/{{.RandomSessionID}}{{else}}/question/request{{end}}" method="{{if .RandomSessionID}}GET{{else}}POST{{end}}">
      {{if .RandomSessionID}}
      <input type="hidden" name="direction" value="next" />
      {{else}}
      <input type="hidden" name="question_id" value="{{.NextID}}" />
      {{end}}

      <button type="submit">下一题</button>
    </form>
    {{end}}

    <!-- 显示结果 -->
    <div id="result"></div>

    <!-- 显示解析 -->
    <div id="showExplanation"></div>

    <script>
      const form = document.getElementById("answerForm");

      form.addEventListener("submit", async function (event) {
        console.log("提交答案事件触发");

        event.preventDefault();

        const choice = document.getElementById("choice").value;

        const question_id = document.getElementById("question_id").value;

        const data = {
          user_id: "test_user",
          question_id: Number(question_id),
          choice: Number(choice),
        };

        const response = await fetch("/question/check_answer", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(data),
        });

        const result = await response.json();

        const resultDiv = document.getElementById("result");

        const explanationDiv = document.getElementById("showExplanation");

        if (result.correct) {
          resultDiv.innerHTML = "✅ 回答正确";

          resultDiv.style.color = "green";
        } else {
          resultDiv.innerHTML = "❌ 回答错误";

          resultDiv.style.color = "red";
        }

        explanationDiv.style.display = "block";

        explanationDiv.innerHTML = "<h3>解析：</h3>" + result.explanation;
      });
    </script>
  </body>
</html>

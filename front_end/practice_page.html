<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>套题练习 · TheBook</title>
    <link rel="icon" href="/static/favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="site-shell">
    <header class="site-header">
        <a class="brand" href="/"><span class="brand-mark">✦</span><span>TheBook</span></a>
        <a class="btn btn-ghost" href="/">返回首页</a>
    </header>

    <section class="question-card">
        <div class="question-meta">
            <span class="category-pill">{{.Category}}</span>
            <span>套题进度 {{.ID}} / {{.TotalQuestions}}</span>
            <p id="timer">剩余时间 <strong id="countdown">--:--</strong></p>
        </div>
        <p class="eyebrow">Practice Mission · {{.ID}}</p>
        <h1>{{.Question}}</h1>

        <input type="hidden" id="question_id" value="{{.RealID}}">
        <input type="hidden" id="practice_id" value="{{.PracticeID}}">
        <input type="hidden" id="duration" value="{{.Duration}}">

        <form id="answerForm" class="answer-panel">
            <fieldset class="choice-fieldset">
                <legend>选择你的答案</legend>
                <label class="choice-card">
                    <input type="radio" name="choice" value="0" required>
                    <span class="choice-letter">A</span><span>{{.OptionA}}</span>
                </label>
                <label class="choice-card">
                    <input type="radio" name="choice" value="1">
                    <span class="choice-letter">B</span><span>{{.OptionB}}</span>
                </label>
                <label class="choice-card">
                    <input type="radio" name="choice" value="2">
                    <span class="choice-letter">C</span><span>{{.OptionC}}</span>
                </label>
                <label class="choice-card">
                    <input type="radio" name="choice" value="3">
                    <span class="choice-letter">D</span><span>{{.OptionD}}</span>
                </label>
            </fieldset>
            <button class="btn btn-secondary" id="saveAnswerButton" type="submit">保存答案</button>
        </form>
        <div id="result" role="status"></div>

        <div class="practice-actions">
            <div class="navigation-row">
                {{if .HasLastID}}
                <form id="lastQuestionForm" action="/practice/{{.PracticeID}}" method="GET">
                    <input type="hidden" name="direction" value="last">
                    <button class="btn btn-ghost" type="submit">← 上一题</button>
                </form>
                {{end}}
                {{if .HasNextID}}
                <form id="nextQuestionForm" action="/practice/{{.PracticeID}}" method="GET">
                    <input type="hidden" name="direction" value="next">
                    <button class="btn btn-ghost" type="submit">下一题 →</button>
                </form>
                {{end}}
            </div>
            <button class="btn btn-primary" id="submitPracticeButton" type="button">提交整套练习</button>
        </div>
        <div id="submitResult" role="status"></div>
    </section>
</main>

<script>
    const form = document.getElementById('answerForm');
    const submitButton = document.getElementById('submitPracticeButton');
    const countdown = document.getElementById('countdown');
    const submitResult = document.getElementById('submitResult');
    const resultDiv = document.getElementById('result');
    const navigationButtons = document.querySelectorAll('#lastQuestionForm button, #nextQuestionForm button');
    let submitted = false;
    let timer;

    function formatTime(seconds) {
        return String(Math.floor(seconds / 60)).padStart(2, '0') + ':' + String(seconds % 60).padStart(2, '0');
    }

    async function submitPractice() {
        if (submitted) return;
        submitted = true;
        clearInterval(timer);
        submitButton.disabled = true;
        document.getElementById('saveAnswerButton').disabled = true;
        navigationButtons.forEach(button => button.disabled = true);

        try {
            const practiceID = document.getElementById('practice_id').value;
            const response = await fetch('/practice/' + Number(practiceID) + '/submit', {method: 'POST'});
            if (!response.ok) throw new Error('提交失败，请重试');
            const result = await response.json();
            submitResult.innerHTML =
                '<div class="inline-summary">总题数：' + result.total + ' · 答对：' + result.correct_count + ' · 答错：' + result.wrong_count + '</div>' +
                '<button id="viewResultButton" class="btn btn-secondary" type="button">查看答题解析</button>';
            document.getElementById('viewResultButton').addEventListener('click', () => {
                window.location.href = '/practice/' + practiceID + '/result';
            });
        } catch (error) {
            submitted = false;
            submitButton.disabled = false;
            document.getElementById('saveAnswerButton').disabled = false;
            navigationButtons.forEach(button => button.disabled = false);
            submitResult.textContent = error.message;
            submitResult.className = 'status-error';
        }
    }

    submitButton.addEventListener('click', submitPractice);

    form.addEventListener('submit', async function (event) {
        event.preventDefault();
        const saveButton = document.getElementById('saveAnswerButton');
        saveButton.disabled = true;
        try {
            const response = await fetch('/practice/answer', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    user_id: 'test_user',
                    question_id: Number(document.getElementById('question_id').value),
                    practice_id: Number(document.getElementById('practice_id').value),
                    choice: Number(new FormData(this).get('choice'))
                })
            });
            if (!response.ok) throw new Error('答案保存失败');
            resultDiv.textContent = '✓ 答案已保存';
            resultDiv.className = 'status-success';
        } catch (error) {
            resultDiv.textContent = error.message;
            resultDiv.className = 'status-error';
        } finally {
            if (!submitted) saveButton.disabled = false;
        }
    });

    let remaining = Math.max(0, Number(document.getElementById('duration').value));
    const deadline = Date.now() + remaining * 1000;
    countdown.textContent = formatTime(remaining);
    timer = setInterval(() => {
        remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
        countdown.textContent = formatTime(remaining);
        if (remaining === 0) submitPractice();
    }, 250);
</script>
</body>
</html>

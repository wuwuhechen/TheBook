<!DOCTYPE html>

<html>

<body>

<h2>获取题目</h2>

<form action="/question/request" method="POST">

    <input 
        type="hidden"
        name="question_id"
        value="1"
    >

    <button type="submit">
        继续上次进度
    </button>

</form>

<form action="/question/random" method="POST">

    <button type="submit">
        随机获取题目
    </button>

</form>

<h2>开始套题练习</h2>

<form id="practiceForm">
    <label for="practiceSize">题目数量：</label>
    <input id="practiceSize" type="number" min="1" value="5" required>
    <button type="submit">开始做套题</button>
</form>

<script>
    document.getElementById("practiceForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const response = await fetch("/practice/init", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                user_id: "test_user",
                practice_size: Number(document.getElementById("practiceSize").value)
            })
        });

        if (response.redirected) {
            window.location.href = response.url;
            return;
        }

        if (!response.ok) {
            alert("练习初始化失败");
        }
    });
</script>

</body>

</html>
